<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOIDEA PRESENSI PKL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at top left,#13203f 0%,transparent 40%),
    radial-gradient(circle at bottom right,#001b2e 0%,transparent 40%),
    linear-gradient(135deg,#050816,#091120,#0d1726);

    color:white;
}

/* GRID */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
    linear-gradient(rgba(0,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,.05) 1px, transparent 1px);

    background-size:30px 30px;

    animation:gridMove 15s linear infinite;
}

@keyframes gridMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(30px);
    }
}

/* CARD */

.login-box{
    position:relative;

    width:280px;
    padding:30px;

    border-radius:22px;

    background:rgba(8,15,30,.65);

    backdrop-filter:blur(15px);

    border:1px solid rgba(0,255,255,.15);

    box-shadow:
    0 0 20px rgba(0,140,255,.25),
    0 0 60px rgba(0,255,255,.08);

    z-index:10;
}

/* GLOW */

.login-box::before{
    content:"";
    position:absolute;
    inset:-2px;

    border-radius:24px;

    background:linear-gradient(
    45deg,
    #00e5ff,
    #007cff,
    #7a5cff,
    #00ffb3
    );

    z-index:-1;

    filter:blur(14px);
    opacity:.4;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:8px;
}

.logo h1{
    font-size:32px;
    font-weight:800;
    letter-spacing:4px;

    background:linear-gradient(
    90deg,
    #00e5ff,
    #007cff,
    #00ffb3
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:shine 4s linear infinite;
}

@keyframes shine{
    0%{
        filter:drop-shadow(0 0 5px #00e5ff);
    }

    50%{
        filter:drop-shadow(0 0 14px #007cff);
    }

    100%{
        filter:drop-shadow(0 0 5px #00ffb3);
    }
}

.subtitle{
    text-align:center;
    font-size:10px;
    color:#8fb7ff;
    margin-bottom:25px;
}

/* INPUT */

.secret-input{
    width:100%;
    padding:12px 14px;

    border:none;
    outline:none;

    border-radius:12px;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:11px;

    text-align:center;

    border:1px solid rgba(255,255,255,.08);

    transition:.3s;
}

.secret-input:focus{
    border:1px solid #00e5ff;

    box-shadow:
    0 0 10px rgba(0,229,255,.45);
}

/* INFO */

.info{
    margin-top:15px;
    text-align:center;
    font-size:8px;
    color:#7d91b5;
}

/* PARTICLE */

.particle{
    position:absolute;
    width:4px;
    height:4px;

    border-radius:50%;

    background:#00e5ff;

    box-shadow:0 0 8px #00e5ff;

    animation:float 8s linear infinite;
}

.p1{
    top:10%;
    left:15%;
}

.p2{
    bottom:18%;
    right:12%;
    animation-delay:2s;
}

.p3{
    top:70%;
    left:10%;
    animation-delay:4s;
}

@keyframes float{
    0%{
        transform:translateY(0px);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        transform:translateY(-90px);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>

<div class="login-box">

    <div class="logo">
        <h1>MOIDEA</h1>
    </div>

    <div class="subtitle">
        Sistem Presensi Praktik Kerja Lapangan
    </div>

    <input
        type="password"
        class="secret-input"
        id="secretKey"
        placeholder="Masukkan Kode"
        autofocus
    >

    <div class="info">
        © 2026 MOIDEA PRESENSI PKL
    </div>

</div>

<script>

const input = document.getElementById("secretKey");

input.addEventListener("input", function(){

    if(input.value === "098@#$mnb"){

        window.location.href = "https://www.presensi.moidea.my.id";

    }

});

</script>

</body>
  </html>
